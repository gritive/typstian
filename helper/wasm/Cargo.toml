[package]
name = "typstian-wasm"
version = "0.0.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "=0.15.1"
typst-ide = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typstian-core = { path = ".." }
wasm-bindgen = "0.2"
